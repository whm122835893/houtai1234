<form id="config-form" class="form-horizontal form-ajax" role="form" method="POST" action="">
    <div class="modal-body">
        <div class="form-group">
            <label class="control-label col-xs-12 col-sm-3">开启签到:</label>
            <div class="col-xs-12 col-sm-7" style="padding-top:7px;">
                <label class="radio-inline"><input type="radio" name="enabled" value="1" {if !isset($config['enabled']) || $config['enabled']}checked{/if}/> 开启</label>
                <label class="radio-inline"><input type="radio" name="enabled" value="0" {if isset($config['enabled']) && !$config['enabled']}checked{/if}/> 关闭</label>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-xs-12 col-sm-3">每日基础积分:</label>
            <div class="col-xs-12 col-sm-7">
                <input type="number" class="form-control" name="base_score" value="{$config.base_score|default=5}" placeholder="用户每日签到获得的积分">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-xs-12 col-sm-3">连续7天额外奖励:</label>
            <div class="col-xs-12 col-sm-7">
                <input type="number" class="form-control" name="day7_bonus" value="{$config.day7_bonus|default=20}" placeholder="连续签到满7天一次性额外奖励">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-xs-12 col-sm-3">连续30天额外奖励:</label>
            <div class="col-xs-12 col-sm-7">
                <input type="number" class="form-control" name="day30_bonus" value="{$config.day30_bonus|default=100}" placeholder="连续签到满30天一次性额外奖励">
            </div>
        </div>
        <div class="alert alert-info" style="margin-bottom:0;">
            <i class="fa fa-info-circle"></i> 用户端每日签到将按此配置发放积分至 <code>fa_user.score</code>；达到连续天数门槛时在基础积分上叠加额外奖励。
        </div>
    </div>
    <div class="modal-footer">
        <button type="submit" class="btn btn-success btn-embossed">保存</button>
        <button type="button" class="btn btn-embossed btn-close" onclick="Layer.closeAll();">关闭</button>
    </div>
</form>
