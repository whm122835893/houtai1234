<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">用户ID:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-user_id" data-rule="用户ID:required;integer" class="form-control" name="row[user_id]" type="number" value="{$row.user_id|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联藏品:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-collection_id" class="form-control selectpage" name="row[collection_id]" type="text" value="{$row.collection_id|htmlentities}"
                   data-source="nft/collection/index" data-field="name" data-primary-key="id" data-pagination="true">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-remark" class="form-control" name="row[remark]" type="text" value="{$row.remark|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            {foreach name="statusList" item="vo"}
            <label class="radio-inline"><input type="radio" name="row[status]" value="{$key}" {in name="key" value="$row.status"}checked{/in}/> {$vo}</label>
            {/foreach}
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
