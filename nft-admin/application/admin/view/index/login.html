<!DOCTYPE html>
<html>
<head>
    {include file="common/meta" /}

    <style type="text/css">
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            color: #606266;
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #065F46 0%, #047857 45%, #10B981 100%);
            overflow-x: hidden;
        }
        /* 装饰光斑 */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
        }
        body::before {
            width: 520px; height: 520px;
            background: radial-gradient(circle, rgba(255,255,255,.14), transparent 65%);
            top: -140px; right: -120px;
        }
        body::after {
            width: 620px; height: 620px;
            background: radial-gradient(circle, rgba(255,255,255,.10), transparent 65%);
            bottom: -220px; left: -160px;
        }

        a { color: #10B981; }

        .login-screen {
            max-width: 420px;
            padding: 0 18px;
            margin: 0 auto;
            position: relative;
            top: 50%;
            transform: translateY(-52%);
        }

        .brand {
            text-align: center;
            margin-bottom: 26px;
        }
        .brand .brand-icon {
            width: 64px; height: 64px;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: rgba(255,255,255,.18);
            border: 1px solid rgba(255,255,255,.35);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 24px rgba(0,0,0,.15);
        }
        .brand .brand-icon .fa {
            font-size: 30px; color: #fff;
        }
        .brand h1 {
            color: #fff;
            font-size: 24px;
            letter-spacing: 4px;
            margin: 0 0 6px;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0,0,0,.18);
        }
        .brand p {
            color: rgba(255,255,255,.75);
            font-size: 13px;
            margin: 0;
            letter-spacing: 2px;
        }

        .login-card {
            background: rgba(255,255,255,.98);
            border-radius: 16px;
            padding: 36px 34px 30px;
            box-shadow: 0 18px 50px rgba(23, 20, 70, .35);
        }

        .login-card h3 {
            margin: 0 0 22px;
            font-size: 17px;
            color: #303133;
            font-weight: 600;
            text-align: center;
        }

        #login-form { margin-top: 0; }

        #login-form .input-group {
            margin-bottom: 16px;
            border-radius: 10px;
        }
        #login-form .input-group-addon {
            background: #ECFDF5;
            border: 1px solid #A7F3D0;
            border-right: none;
            border-radius: 10px 0 0 10px;
            color: #059669;
        }
        #login-form .form-control {
            height: 44px;
            font-size: 14px;
            border: 1px solid #E2E8F0;
            box-shadow: none;
            border-radius: 0 10px 10px 0;
        }
        #login-form .form-control:focus {
            border-color: #10B981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, .15);
        }

        #login-form .checkbox { margin: 4px 0 14px; }
        #login-form .checkbox label { color: #909399; font-weight: normal; }

        .btn-signin {
            height: 46px;
            border: none;
            border-radius: 10px !important;
            font-size: 15px;
            letter-spacing: 6px;
            font-weight: 600;
            color: #fff !important;
            background: linear-gradient(135deg, #059669, #10B981) !important;
            box-shadow: 0 8px 20px rgba(5, 150, 105, .4);
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .btn-signin:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(5, 150, 105, .5);
        }

        .login-footer {
            text-align: center;
            margin-top: 22px;
            color: rgba(255,255,255,.65);
            font-size: 12px;
            letter-spacing: 1px;
        }

        #errtips {
            margin-bottom: 14px;
            padding: 8px 12px;
            border-radius: 8px;
            background: #fef0f0;
            color: #f56c6c;
            font-size: 13px;
        }

        @media (max-width: 767px) {
            .login-screen { padding: 0 20px; }
        }
    </style>
</head>
<body>
<div class="container" style="height:100vh;position:relative;">
    <div class="login-screen">
        <div class="brand">
            <div class="brand-icon"><i class="fa fa-diamond"></i></div>
            <h1>数字藏品管理后台</h1>
            <p>NFT DIGITAL COLLECTIBLE ADMIN</p>
        </div>
        <div class="login-card">
            <form action="" method="post" id="login-form">
                <!--@AdminLoginFormBegin-->
                <div id="errtips" class="hide"></div>
                {:token()}
                <div class="input-group">
                    <div class="input-group-addon"><span class="glyphicon glyphicon-user" aria-hidden="true"></span></div>
                    <input type="text" class="form-control" id="pd-form-username" placeholder="{:__('Username')}" name="username" autocomplete="off" value="admin" data-rule="{:__('Username')}:required;username"/>
                </div>

                <div class="input-group">
                    <div class="input-group-addon"><span class="glyphicon glyphicon-lock" aria-hidden="true"></span></div>
                    <input type="password" class="form-control" id="pd-form-password" placeholder="{:__('Password')}" name="password" autocomplete="off" value="admin123" data-rule="{:__('Password')}:required;password"/>
                </div>
                {if $keeyloginhours>0}
                <div class="form-group checkbox">
                    <label class="inline" for="keeplogin" data-toggle="tooltip" title="{:__('The duration of the session is %s hours', $keeyloginhours)}">
                        <input type="checkbox" name="keeplogin" id="keeplogin" value="1"/>
                        {:__('Keep login')}
                    </label>
                </div>
                {/if}
                <div class="form-group">
                    <button type="submit" class="btn btn-lg btn-block btn-signin">{:__('Sign in')}</button>
                </div>
                <!--@AdminLoginFormEnd-->
            </form>
        </div>
        <div class="login-footer">Powered by FastAdmin · 数字藏品业务系统 V2</div>
    </div>
</div>
{include file="common/script" /}
</body>
</html>
